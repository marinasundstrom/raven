name: Distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without a leading v
        required: true
        default: 0.1.0-preview.1
      publish_github_release:
        description: Publish the artifacts to the matching v<version> GitHub release
        required: true
        type: boolean
        default: false
      publish_nuget:
        description: Publish the validated package family to NuGet.org
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sdk:
    name: SDK ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Build SDK
        run: scripts/package-sdk.sh "${{ matrix.rid }}" "${{ inputs.version }}"
      - name: Validate SDK structure
        run: scripts/test-distribution.sh --structure-only "artifacts/distribution/raven-sdk-${{ inputs.version }}-${{ matrix.rid }}"
      - name: Smoke test native SDK
        if: matrix.rid == 'linux-x64'
        run: scripts/test-distribution.sh "artifacts/distribution/raven-sdk-${{ inputs.version }}-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v6
        with:
          name: raven-sdk-${{ matrix.rid }}
          path: artifacts/distribution/raven-sdk-${{ inputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: src/Raven.VSCode/package-lock.json
      - run: scripts/package-vscode.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: raven-vscode
          path: artifacts/distribution/raven-vscode.vsix
          if-no-files-found: error

  packages:
    name: NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Build and validate packages
        run: scripts/package-nuget.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: raven-nuget
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  collect:
    name: Collect release artifacts
    needs: [sdk, vscode, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Add installers and checksums
        run: |
          cp scripts/install-raven.sh scripts/install-raven.ps1 release/
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: raven-distribution
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_tag="v${{ inputs.version }}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Select tag $expected_tag when manually dispatching a release." >&2
            exit 1
          fi
          if ! gh release view "$expected_tag" >/dev/null 2>&1; then
            release_args=(--generate-notes)
            if [[ "${{ inputs.version }}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$expected_tag" "${release_args[@]}"
          fi
          gh release upload "$expected_tag" release/* --clobber

  publish-nuget:
    name: Publish NuGet packages
    if: inputs.publish_nuget
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: raven-nuget
          path: packages
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Validate selected release tag
        shell: bash
        run: |
          expected_tag="v${{ inputs.version }}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Select tag $expected_tag when manually dispatching NuGet publication." >&2
            exit 1
          fi
      - name: Authenticate with NuGet.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: marna.li
      - name: Publish package family
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
