<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Experimental macro-powered component templates authored in Raven and rendered by Blazor WebAssembly." />
    <title>Raven × Blazor</title>
    <base href="./" />
    <link rel="stylesheet" href="_content/ComponentMacros/app.css" />
    <link rel="stylesheet" href="ComponentMacrosShowcase.Wasm.styles.css" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <main class="loading-shell" role="status" aria-live="polite" aria-label="Loading the Raven component template showcase">
            <div class="loading-card">
                <div class="loading-brand" aria-hidden="true">
                    <span class="loading-mark">R</span>
                    <span class="loading-wordmark">Raven</span>
                </div>
                <span class="loading-eyebrow">Experimental showcase</span>
                <h1>Bringing component templates to life.</h1>
                <p>Preparing the interactive Raven and Blazor examples…</p>
                <div class="loading-progress" aria-hidden="true"><span></span></div>
            </div>
        </main>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
