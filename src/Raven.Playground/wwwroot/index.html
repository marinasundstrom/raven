<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100e15" />
    <meta name="description" content="Compile and run Raven programs entirely in your browser with WebAssembly." />
    <title>Raven Playground</title>
    <base href="./" />
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem("raven-theme") ?? "system";
    </script>
    <link rel="stylesheet" href="css/raven-theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="js/editor.css" />
    <link href="Raven.Playground.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-shell" role="status" aria-live="polite">
            <div class="loading-mark">R</div>
            <div class="loading-progress" aria-hidden="true"><span></span></div>
            <p class="loading-progress-text"></p>
            <p>Loading Raven in WebAssembly…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
